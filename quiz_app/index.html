<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizNow</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <main class="quiz-container">

      <header class="quiz-header">
        <h1>Quiz Application</h1>
        <p>Test your knowledge!</p>
      </header>

      <form id="quiz-form">

        <!-- Question 1 -->
        <section class="question">
          <p>1. Who is the prime minister of India?</p>

          <input type="radio" name="prime_minister" id="rahul" />
          <label for="rahul"><span>A.</span> Rahul Gandhi</label>
          <br />

          <input type="radio" name="prime_minister" id="modi" />
          <label for="modi"><span>B.</span> Narendra Modi</label>
          <br />

          <input type="radio" name="prime_minister" id="dhoni" />
          <label for="dhoni"><span>C.</span> MS Dhoni</label>
          <br />

          <input type="radio" name="prime_minister" id="kohli" />
          <label for="kohli"><span>D.</span> Virat Kohli</label>
          <br />

          <h3 class="correct">Correct Answer ✓</h3>
          <h3 class="incorrect">Incorrect Answer ✗</h3>
        </section>


        <!-- Question 2 -->
        <section class="question">
          <p>2. Which planet is known as the Red Planet?</p>

          <input type="radio" name="q2" id="earth" />
          <label for="earth"><span>A.</span> Earth</label>
          <br />

          <input type="radio" name="q2" id="mars" />
          <label for="mars"><span>B.</span> Mars</label>
          <br />

          <input type="radio" name="q2" id="jupiter" />
          <label for="jupiter"><span>C.</span> Jupiter</label>
          <br />

          <input type="radio" name="q2" id="venus" />
          <label for="venus"><span>D.</span> Venus</label>
          <br />

          <h3 class="correct">Correct Answer ✓</h3>
          <h3 class="incorrect">Incorrect Answer ✗</h3>
        </section>


        <!-- Question 3 -->
        <section class="question">
          <p>3. What is the capital of India?</p>

          <input type="radio" name="q3" id="mumbai" />
          <label for="mumbai"><span>A.</span> Mumbai</label>
          <br />

          <input type="radio" name="q3" id="delhi" />
          <label for="delhi"><span>B.</span> New Delhi</label>
          <br />

          <input type="radio" name="q3" id="kolkata" />
          <label for="kolkata"><span>C.</span> Kolkata</label>
          <br />

          <input type="radio" name="q3" id="chennai" />
          <label for="chennai"><span>D.</span> Chennai</label>
          <br />

          <h3 class="correct">Correct Answer ✓</h3>
          <h3 class="incorrect">Incorrect Answer ✗</h3>
        </section>


      </form>

    </main>
  </body>
</html>
