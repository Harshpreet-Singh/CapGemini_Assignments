<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }
      .heading {
        text-align: center;
        color: #333;
        font-size: 2rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        padding: 1rem;
      }
      #card_container {
        background-color: #f0efef;
        padding: 2rem;
      }
      .title {
        text-align: center;
        color: #333;
        font-size: 2rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
      #cards {
        display: flex;
        justify-content: space-around;
        flex-wrap: nowrap;
      }
      .card1,
      .card2,
      .card3,
      .card4 {
        width: 200px;
        height: 150px;
        margin: 1rem;
        background-color: #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #555;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="heading">CGC Student Dashboard</h1>
      <div id="card_container">
        <h1 class="title">Students</h1>
        <div id="cards">
          <div class="card1">
            <span>Name: Student 1</span>
            <span>Course: Btech</span>
        </div>
          <div class="card2">
            <span>Name: Student 2</span>
            <span>Course: Mtech</span>
          </div>
          <div class="card3">
            <span>Name: Student 3</span>
            <span>Course: Bsc</span>
          </div>
          <div class="card4">
            <span>Name: Student 4</span>
            <span>Course: Msc</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
