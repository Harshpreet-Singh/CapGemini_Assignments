<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task 03</title>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 { 
      margin-bottom: 30px; 
    }
    .chart-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .pie-chart {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: conic-gradient(
        #4caf50 0deg 126deg,
        #2196f3 126deg 234deg,
        #ff9800 234deg 306deg,
        #f44336 306deg 360deg
      );
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
    }

    .color-box {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }

    .maths{ 
      background-color: #4caf50; 
    }
    .webdev{ 
      background-color: #2196f3; 
    }
    .dbms{ 
      background-color: #ff9800; 
    }
    .python{ 
      background-color: #f44336; 
    }
  </style>
</head>
<body>

  <h1>MST Results Summary</h1>

  <div class="chart-container">
    <div class="pie-chart"></div>

    <div class="legend">
      <div class="legend-item">
        <div class="color-box maths"></div>
        <span>Mathematics (35%)</span>
      </div>
      <div class="legend-item">
        <div class="color-box webdev"></div>
        <span>Web Development (30%)</span>
      </div>
      <div class="legend-item">
        <div class="color-box dbms"></div>
        <span>Database Systems (20%)</span>
      </div>
      <div class="legend-item">
        <div class="color-box python"></div>
        <span>Python Programming (15%)</span>
      </div>
    </div>
  </div>

</body>
</html>
