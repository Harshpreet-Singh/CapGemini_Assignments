<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task 01</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    h1 { margin-bottom: 20px; }

    /* Flexbox container for button grid alignment */
    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      max-width: 900px;
    }

    /* Common button styles */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* 20 Different Linear Gradients */
    .btn-1  { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
    .btn-2  { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
    .btn-3  { background: linear-gradient(45deg, #ee9ca7, #ffdde1); color: #333; }
    .btn-4  { background: linear-gradient(45deg, #06beb6, #48b1bf); }
    .btn-5  { background: linear-gradient(45deg, #eb3349, #f45c43); }
    .btn-6  { background: linear-gradient(45deg, #da22ff, #9733ee); }
    .btn-7  { background: linear-gradient(45deg, #02aab0, #00cdac); }
    .btn-8  { background: linear-gradient(45deg, #f2709c, #ff9472); }
    .btn-9  { background: linear-gradient(45deg, #4776e6, #8e54e9); }
    .btn-10 { background: linear-gradient(45deg, #ff8008, #ffc837); }
    .btn-11 { background: linear-gradient(45deg, #1fa2ff, #12d8fa); }
    .btn-12 { background: linear-gradient(45deg, #12c2e9, #c471ed); }
    .btn-13 { background: linear-gradient(45deg, #b92b27, #1565c0); }
    .btn-14 { background: linear-gradient(45deg, #d3cce3, #eedee6); color: #333; }
    .btn-15 { background: linear-gradient(45deg, #8e2de2, #4a00e0); }
    .btn-16 { background: linear-gradient(45deg, #f857a6, #ff5858); }
    .btn-17 { background: linear-gradient(45deg, #3a7bd5, #3a6073); }
    .btn-18 { background: linear-gradient(45deg, #00b09b, #96c93d); }
    .btn-19 { background: linear-gradient(45deg, #eecda3, #ef629f); }
    .btn-20 { background: linear-gradient(45deg, #e1eec3, #f05053); }
  </style>
</head>
<body>
  <h1>Task 01: 20 Gradient Buttons</h1>
  <div class="button-container">
    <button class="btn btn-1">Button 1</button>
    <button class="btn btn-2">Button 2</button>
    <button class="btn btn-3">Button 3</button>
    <button class="btn btn-4">Button 4</button>
    <button class="btn btn-5">Button 5</button>
    <button class="btn btn-6">Button 6</button>
    <button class="btn btn-7">Button 7</button>
    <button class="btn btn-8">Button 8</button>
    <button class="btn btn-9">Button 9</button>
    <button class="btn btn-10">Button 10</button>
    <button class="btn btn-11">Button 11</button>
    <button class="btn btn-12">Button 12</button>
    <button class="btn btn-13">Button 13</button>
    <button class="btn btn-14">Button 14</button>
    <button class="btn btn-15">Button 15</button>
    <button class="btn btn-16">Button 16</button>
    <button class="btn btn-17">Button 17</button>
    <button class="btn btn-18">Button 18</button>
    <button class="btn btn-19">Button 19</button>
    <button class="btn btn-20">Button 20</button>
  </div>
</body>
</html>
